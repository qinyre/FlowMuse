# Include inside the Web server {} (Nginx 1.24+).
# Build with --no-web-resources-cdn and --pwa-strategy=none, then run:
# python tool/precompress_web.py build/web
# Enable HTTP/2 on the existing TLS listen directives for Nginx 1.24:
# listen 443 ssl http2; / listen [::]:443 ssl http2;
location = / {
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
}

location / {
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript application/wasm application/json text/css image/svg+xml font/ttf font/otf application/octet-stream;
    # Revalidate unversioned resources so application updates remain consistent.
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
