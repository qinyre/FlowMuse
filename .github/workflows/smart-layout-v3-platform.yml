name: Smart Layout V3 Platform

on:
  workflow_dispatch:
  push:
    paths:
      - "FlowMuse-App/lib/features/whiteboard/smart_layout/**"
      - "FlowMuse-App/tool/smart_layout_v3/platform/**"
      - ".github/workflows/smart-layout-v3-platform.yml"

permissions:
  contents: read

concurrency:
  group: smart-layout-v3-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Build matrix + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三类宿主覆盖六端配方的可用面：ubuntu(android+web)、
        # windows(windows+web)、macos(ios+macos+web)。OHOS 无托管 runner，
        # 恒为 release_deferred（配方/恢复命令冻结在 PlatformBuildMatrix）。
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: FlowMuse-App
    steps:
      - uses: actions/checkout@v4
      - name: Set up OpenHarmony Flutter (pinned, same as quality.yml)
        shell: bash
        run: |
          cloned=false
          for attempt in 1 2 3; do
            if git -c http.version=HTTP/1.1 clone --depth 1 --branch 3.41.10-ohos-0.0.1-canary1 https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter"; then
              cloned=true
              break
            fi
            rm -rf "$RUNNER_TEMP/flutter"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "$cloned" != true ]; then
            echo "OpenHarmony Flutter mirror clone failed after 3 attempts" >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Provide HarmonyOS SDK layout for checks
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hos-sdk/hmscore" "$RUNNER_TEMP/hos-sdk/openharmony"
          echo "HOS_SDK_HOME=$RUNNER_TEMP/hos-sdk" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      - name: Cross-platform smoke (entry→commit→undo→reopen)
        run: flutter test tool/smart_layout_v3/platform
      - name: Build matrix (available targets build; unavailable release_deferred)
        shell: bash
        run: |
          dart run tool/smart_layout_v3/platform/platform_build_matrix.dart \
            --report "../docs/研发记录/evidence/smart-layout-v3/platform/v3-605a-report-${{ matrix.os }}.json"
      - name: Archive platform report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-layout-v3-platform-report-${{ matrix.os }}
          path: docs/研发记录/evidence/smart-layout-v3/platform/v3-605a-report-${{ matrix.os }}.json
          if-no-files-found: warn
