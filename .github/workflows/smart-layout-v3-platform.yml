name: Smart Layout V3 Platform

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "FlowMuse-App/lib/features/whiteboard/smart_layout/**"
      - "FlowMuse-App/tool/smart_layout_v3/platform/**"
      - "FlowMuse-App/pubspec.yaml"
      - "FlowMuse-App/pubspec.lock"
      - "FlowMuse-App/tool/vendor/code_assets/**"
      - "FlowMuse-App/android/**"
      - "FlowMuse-App/ios/**"
      - "FlowMuse-App/macos/**"
      - "FlowMuse-App/windows/**"
      - "FlowMuse-App/linux/**"
      - "FlowMuse-App/web/**"
      - "FlowMuse-App/ohos/**"
      - ".github/actions/setup-flutter/**"
      - ".github/workflows/smart-layout-v3-platform.yml"

permissions:
  contents: read

concurrency:
  group: smart-layout-v3-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Build matrix + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三类宿主覆盖六端配方的可用面：ubuntu(android+web)、
        # windows(windows+web)、macos(ios+macos+web)。OHOS 无托管 runner，
        # 恒为 release_deferred（配方/恢复命令冻结在 PlatformBuildMatrix）。
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: FlowMuse-App
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cross-platform smoke (entry→commit→undo→reopen)
        run: flutter test tool/smart_layout_v3/platform
      - name: Build matrix (available targets build; unavailable release_deferred)
        shell: bash
        run: |
          dart run tool/smart_layout_v3/platform/platform_build_matrix.dart \
            --report "../docs/研发记录/evidence/smart-layout-v3/platform/v3-605a-report-${{ matrix.os }}.json"
      - name: Archive platform report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-layout-v3-platform-report-${{ matrix.os }}
          path: docs/研发记录/evidence/smart-layout-v3/platform/v3-605a-report-${{ matrix.os }}.json
          if-no-files-found: warn
